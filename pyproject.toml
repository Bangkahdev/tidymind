[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tidymind"
version = "0.1.0"
description = "Local AI file organizer CLI: a local open-weight model proposes, deterministic code validates, you approve."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # standard library only at runtime (HTTP via urllib)
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
tidymind = "tidymind.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "mutmut>=3",
    "zizmor>=1.0",
    "actionlint-py>=1.7",
    "pip-licenses>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tidymind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["blackbox: drives the public CLI in a subprocess", "integration: uses the fake Ollama HTTP server"]

[tool.coverage.run]
branch = true
source = ["tidymind"]
omit = ["src/tidymind/__main__.py"]  # 3-line entry-point boilerplate (documented exclusion, SRS 8.3)

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4", "RET"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "E501"]
"scripts/**" = ["E501", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/tidymind"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.mutmut]
paths_to_mutate = ["src/tidymind/validator.py", "src/tidymind/executor.py"]
tests_dir = ["tests/"]
