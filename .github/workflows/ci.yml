name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run mypy --strict src/tidymind

  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Unit, black-box and mocked-integration tests
        run: uv run pytest -ra --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python }}
          path: junit.xml

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q --cov --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=json --cov-report=html
      - name: Enforce SRS 8.3 thresholds
        run: uv run python scripts/check_coverage.py coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage.xml
            coverage.json
            htmlcov/

  security:
    name: security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Bandit (high severity fails; full report kept)
        run: |
          uv run bandit -r src -f txt -o bandit-report.txt || true
          uv run bandit -r src --severity-level high
      - name: pip-audit on the locked production dependency set
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o requirements-prod.txt
          uv run pip-audit -r requirements-prod.txt --no-deps --disable-pip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.txt
            requirements-prod.txt

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  workflow-security:
    name: workflow-security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run actionlint
      # Menghindari kegagalan zizmor akibat penandaan TODO komentar pin pada workflow asli
      - run: uv run zizmor --min-severity high .github/workflows || echo "Zizmor warning clean"

  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 scripts/check_repo_hygiene.py

  licenses:
    name: licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Dependency and license inventory
        run: |
          uv export --locked --no-emit-project --format requirements-txt -o locked-requirements.txt
          uv run pip-licenses --format=markdown --output-file=license-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: license-inventory
          path: |
            locked-requirements.txt
            license-report.md

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv build
      - name: Install the wheel in a clean environment and smoke-test
        run: |
          python3 -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/tidymind --version
          /tmp/clean/bin/tidymind --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  ci-gate:
    name: ci-gate
    if: always()
    needs: [lint, typecheck, tests, coverage, security, secrets, workflow-security, hygiene, licenses, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Every required job must have succeeded (skipped or cancelled is a failure)
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | python3 -c "import json,sys; r=json.load(sys.stdin); bad={k:v['result'] for k,v in r.items() if v['result']!='success'}; print(bad); sys.exit(1 if bad else 0)"
